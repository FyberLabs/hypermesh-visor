name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Check embedded includes
        run: bash ci/check-includes.sh
      - name: Check display harness process identity
        run: python3 ci/display/test-process-identity.py
      - name: Check MCP SSE fixture disconnect observation
        run: python3 ci/display/test-mcp-http-fixture.py
      - name: Check display typing interruption observer
        run: python3 ci/display/test-interrupt-type.py
      - run: cargo test --locked --workspace
      - name: Another Linux user cannot drive the desktop
        run: bash ci/cross-user.sh
      - name: Workspace tests with harness environment
        run: |
          set -euo pipefail
          runtime=$(mktemp -d)
          config=$(mktemp -d)
          chmod 700 "$runtime" "$config"
          export HYPERMESH_AUTOMATION_RESUME_SECS=2
          export HYPERMESH_RUNTIME_DIR="$runtime"
          export HYPERMESH_CONFIG_DIR="$config"
          export HYPERMESH_COMPANION_POLL_MS=200
          cargo test --locked --workspace

  native-mcp-discovery:
    name: MCP discovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test shared discovery code on the native filesystem
        run: cargo test --locked --manifest-path ci/mcp-discovery/Cargo.toml

  native-macos-workspace:
    name: Native macOS workspace
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native helper
        run: |
          mkdir -p target/debug
          swiftc -parse-as-library -O native/macos/Desktop.swift -o target/debug/hypermesh-native-desktop
      - name: Native event mapping and unauthenticated bridge refusal
        run: |
          target/debug/hypermesh-native-desktop --self-test
          python3 native/macos/test-bridge-refusal.py target/debug/hypermesh-native-desktop
      - name: Native workspace tests
        env:
          TMPDIR: /tmp
        run: cargo test --locked --workspace
