name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packages:
    name: linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install packagers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu rpm golang-go
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          tar -C /tmp -xzf /tmp/nfpm.tar.gz nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Check embedded includes
        run: bash ci/check-includes.sh

      - name: Test
        run: cargo test --locked --workspace

      - name: Package
        run: bash packaging/package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hypermesh-visor-linux
          path: dist/*
          if-no-files-found: error

  installed-x11:
    name: installed Debian X11 (${{ matrix.asset }})
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            asset: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      QUALIFICATION_ARCH: ${{ matrix.asset }}
      QUALIFICATION_DEB_ARCH: ${{ matrix.deb_arch }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download candidate packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: hypermesh-visor-linux
          path: dist

      - name: Install the candidate and display dependencies
        run: |
          test "$(uname -m)" = "$QUALIFICATION_ARCH"
          test "$(dpkg --print-architecture)" = "$QUALIFICATION_DEB_ARCH"
          test "$(dpkg-deb -f "dist/hypermesh-visor-${QUALIFICATION_ARCH}.deb" Architecture)" = "$QUALIFICATION_DEB_ARCH"
          (cd dist && sha256sum --check checksums.txt)
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "./dist/hypermesh-visor-${QUALIFICATION_ARCH}.deb" \
            xserver-xorg-core xserver-xorg-video-dummy \
            xserver-xorg-input-libinput xserver-xorg-input-evdev \
            x11-utils x11-apps x11-xserver-utils xinput xdotool \
            python3 python3-tk python3-xlib python3-gi gir1.2-webkit2-4.1 iproute2
          sudo modprobe uinput
          test "$(dpkg-query -W -f='${Status}' hypermesh-visor)" = 'install ok installed'
          test -z "$(dpkg --verify hypermesh-visor)"
          mkdir -p qualification
          {
            printf 'revision=%s\n' "$GITHUB_SHA"
            printf 'run=%s/%s/actions/runs/%s attempt=%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            cat /etc/os-release
            uname -m
            dpkg-query -W hypermesh-visor xserver-xorg-core
            sha256sum "dist/hypermesh-visor-${QUALIFICATION_ARCH}.deb" \
              /usr/bin/hypermesh-visor /usr/bin/hypermesh-companion
          } > qualification/candidate.txt

      - name: Exercise installed binaries
        run: |
          # No source build or PATH-selected executable may stand in for the package.
          test ! -e target/debug/hypermesh-visor
          bash ci/display/run.sh --installed x11 > qualification/display.log 2>&1

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installed-x11-${{ matrix.asset }}-${{ github.sha }}
          path: |
            qualification/
            display-logs/mcp-discovery.log
            display-logs/mcp-source-precedence.log
            display-logs/mcp-http.log
            display-logs/mcp-persistence.log
            display-logs/mcp-daemon-crash.log
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installed-x11-failure-${{ matrix.asset }}-${{ github.sha }}
          path: display-logs/
          if-no-files-found: ignore

  publish:
    name: publish GitHub release
    needs: [packages, installed-x11]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: hypermesh-visor-linux
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/hypermesh-visor-x86_64
            dist/hypermesh-visor-x86_64.deb
            dist/hypermesh-visor-x86_64.rpm
            dist/hypermesh-visor-aarch64
            dist/hypermesh-visor-aarch64.deb
            dist/hypermesh-visor-aarch64.rpm
            dist/checksums.txt
          fail_on_unmatched_files: true
