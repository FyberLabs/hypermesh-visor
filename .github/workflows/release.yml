name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packages:
    name: linux packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install packagers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu rpm
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          tar -C /tmp -xzf /tmp/nfpm.tar.gz nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Test
        run: cargo test --locked

      - name: Package
        run: bash packaging/package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: hypermesh-visor-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: hypermesh-visor-linux
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
