[package]
name = "hypermesh-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native-app OAuth session shared by the Hypermesh CLI and desktop companion"
publish = false

[dependencies]
base64 = "0.22"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
