# Package metadata for hypermesh-visor. The release workflow fills VERSION and
# NFPM_ARCH (amd64 or arm64). nfpm maps those Debian arch names onto x86_64
# and aarch64 for the RPM. The published asset names stay
# hypermesh-visor-<arch>, .deb, and .rpm. The raw asset is still the visor
# binary. The packages also install the CLI and the desktop companion.
name: hypermesh-visor
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: Fyber Labs <github@fyberlabs.com>
description: Linux desktop visor, CLI, and companion for Hypermesh
homepage: https://github.com/FyberLabs/hypermesh-visor
contents:
  - src: ${VISOR_BIN}
    dst: /usr/bin/hypermesh-visor
    expand: true
    file_info:
      mode: 0755
  - src: ${COMPANION_BIN}
    dst: /usr/bin/hypermesh-companion
    expand: true
    file_info:
      mode: 0755
  - src: ${DESKTOP_MCP_BIN}
    dst: /usr/bin/hypermesh-desktop-mcp
    expand: true
    file_info:
      mode: 0755
  - src: ${CLI_BIN}
    dst: /usr/bin/hypermesh
    expand: true
    file_info:
      mode: 0755
  - src: ${HM_BIN}
    dst: /usr/bin/hm
    expand: true
    file_info:
      mode: 0755
  - src: packaging/hypermesh-companion.desktop
    dst: /usr/share/applications/hypermesh-companion.desktop
    file_info:
      mode: 0644
  - src: packaging/hypermesh-companion.desktop
    dst: /etc/xdg/autostart/hypermesh-companion.desktop
    file_info:
      mode: 0644
