x-bot: &bot
  image: ${VISOR_IMAGE:?Set VISOR_IMAGE to an immutable image digest}
  user: "1000:1000"
  group_add: ["2000"]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  network_mode: none
  pids_limit: 512
  mem_limit: 2g
  cpus: 2
  shm_size: 256m
  tmpfs:
    - /run/visor:uid=1000,gid=1000,mode=0700,size=64m
    - /tmp:mode=1777,size=256m
  restart: unless-stopped
  stop_grace_period: 15s
services:
  writer:
    <<: *bot
    volumes:
      - writer-home:/home/bot
      - shared:/resources/share
  reader:
    <<: *bot
    volumes:
      - reader-home:/home/bot
      - shared:/resources/share:ro
volumes:
  writer-home:
  reader-home:
  shared:
    # Bounded ephemeral exchange. Use an operator-provisioned, quota-enforced
    # external volume for durable resources; never mount another bot's home.
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=268435456,uid=1000,gid=2000,mode=2770
