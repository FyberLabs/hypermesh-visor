# Headless Xorg for the display harness.
# The dummy driver is the screen. libinput attaches the harness uinput
# nodes (product names start with hypermesh-display) as slave devices.
# XTEST is still present; those uinput nodes are not XTEST.

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowEmptyInput" "true"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 131072
    Option "IgnoreEDID" "true"
    Option "NoDDC" "true"
EndSection

Section "Monitor"
    Identifier "monitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    # Wide enough that a drag is many pointer batches, so a pause can land
    # while the button is still down. Height fits the companion window.
    Modeline "16384x1024" 218.76 16384 16416 16448 16480 1024 1025 1028 1031 -hsync +vsync
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "16384x1024"
        Virtual 16384 1024
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
EndSection

Section "InputClass"
    Identifier "hypermesh-display"
    MatchProduct "hypermesh-display"
    Driver "libinput"
    Option "Ignore" "off"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"
EndSection
