[package]
name = "visor-native-mcp-discovery-check"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the actual discovery implementation on each native OS independently
# of the Linux desktop/input backends. This is not a visor distribution.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
