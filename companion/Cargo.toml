[package]
name = "hypermesh-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Linux desktop companion for Hypermesh"
publish = false

[[bin]]
name = "hypermesh-companion"
path = "src/main.rs"

[dependencies]
hypermesh-session = { path = "../session" }
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.13", features = ["render", "xinput"] }
